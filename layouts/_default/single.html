{{ define "main" }}

    <div class="page-hero-inner">
      <h1>{{ .Title }}</h1>
      {{ with .Params.description }}<p class="lead">{{ . }}</p>{{ end }}
    </div>
  </div>
  <div class="page-content">
    <div class="intro-section">
      {{ .Content }}
    </div>
  </div>
{{ end }}
