vision:
  - person: "Anna Kowalska — Voorzitter"
    title: "Een verbonden Amersfoort"
    text: "Wij bouwen bruggen tussen mensen, wijken en ideeën. Amersfoort verdient een stem die verder kijkt dan de gemeentegrenzen."
    photo: "/img/team/anna-kowalska.jpg"
  - person: "Thomas Bergmann — Secretaris"
    title: "Groen en duurzaam"
    text: "Duurzaamheid is geen luxe maar een noodzaak. Wij zetten ons in voor groene energie, schone lucht en klimaatbestendig bouwen."
    photo: "/img/team/thomas-bergmann.jpg"
  - person: "Nora Janssen — Penningmeester"
    title: "Eerlijk en transparant"
    text: "Politiek begint met vertrouwen. Wij zijn helder over onze keuzes en verantwoorden ons altijd aan de gemeenschap."
    photo: "/img/team/nora-janssen.jpg"

members:
  - name: "Anna Kowalska"
    role: "Voorzitter"
    statement: "Amersfoort verdient een stem die verder kijkt dan de gemeentegrenzen."
