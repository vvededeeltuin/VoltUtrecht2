vision:
  - person: "Ahmed El Ouali — Fractievoorzitter"
    title: "Helder en constructief"
    text: "Wij brengen de Volt-stem in de raad — zonder omwegen, gebaseerd op feiten en altijd gericht op samenwerking."
    photo: "/img/team/ahmed-el-ouali.jpg"
  - person: "Nora Janssen — Raadslid"
    title: "Sociaal en groen"
    text: "Lokaal beleid met een Europese blik. Wij verbinden duurzaamheid met sociale rechtvaardigheid in elke raadsvergadering."
    photo: "/img/team/nora-janssen.jpg"
  - person: "Thomas Bergmann — Raadslid"
    title: "Toekomstgericht"
    text: "De keuzes van vandaag bepalen de wereld van morgen. Wij stemmen altijd met de toekomst in gedachten."
    photo: "/img/team/thomas-bergmann.jpg"

members:
  - name: "Ahmed El Ouali"
